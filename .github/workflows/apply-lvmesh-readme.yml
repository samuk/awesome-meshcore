name: Apply LVMesh README update

on:
  push:
    branches:
      - add-lehigh-valley-mesh

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README and remove temporary workflow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()

          website_old = "  - [Kentucky Mesh](https://mesh-ky.org/)\n  - [Lexington, KY Mesh](https://meshcorelexington.com/)"
          website_new = "  - [Kentucky Mesh](https://mesh-ky.org/)\n  - [Lehigh Valley Mesh](https://lvmesh.com/) - Serves Eastern Pennsylvania and New Jersey.\n  - [Lexington, KY Mesh](https://meshcorelexington.com/)"

          discord_old = "- [CT Mesh Discord](https://discord.gg/m4F328as3K)\n- [Missouri Mesh Discord](https://missourimesh.org/discord)"
          discord_new = "- [CT Mesh Discord](https://discord.gg/m4F328as3K)\n- [Lehigh Valley Mesh Discord](https://discord.lvmesh.com/)\n- [Missouri Mesh Discord](https://missourimesh.org/discord)"

          if website_old not in text:
              raise SystemExit('Website insertion point not found')
          if discord_old not in text:
              raise SystemExit('Discord insertion point not found')

          text = text.replace(website_old, website_new, 1)
          text = text.replace(discord_old, discord_new, 1)
          readme.write_text(text)

          Path('.github/workflows/apply-lvmesh-readme.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/apply-lvmesh-readme.yml
          git commit -m "Add Lehigh Valley Mesh"
          git push
